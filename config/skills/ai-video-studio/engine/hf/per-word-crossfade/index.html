<html lang="en"><head><style>[data-hf-demo]{visibility:hidden!important}[data-hf-anc]{background:transparent!important;box-shadow:none!important;border-color:transparent!important}</style><script>(function(){
function own(o){try{return (parent!==window&&o&&o[window.name])||null}catch(e){return null}}
function vars(){var d={};document.querySelectorAll('[data-composition-variables]').forEach(function(el){try{JSON.parse(el.getAttribute('data-composition-variables')).forEach(function(v){if(v&&v.id!=null&&'default' in v)d[v.id]=v.default})}catch(e){}});document.querySelectorAll('[data-variable-values]').forEach(function(el){try{var o=JSON.parse(el.getAttribute('data-variable-values'));for(var k in o)d[k]=o[k]}catch(e){}});var o=own(parent.HF_VARS)||{};for(var k in o)if(o[k]!==''&&o[k]!=null)d[k]=o[k];return d}
window.__hyperframes={getVariables:vars};
window.__hfApply=function(){var tx=own(parent.HF_TEXTS)||{};for(var i in tx){if(tx[i]==null)continue;document.querySelectorAll('[data-hft="'+i+'"]').forEach(function(el){el.textContent=tx[i]})}
var v=vars(),r=document.querySelector('[data-composition-id]')||document.documentElement;for(var k in v){if(typeof v[k]==='string'||typeof v[k]==='number'){r.style.setProperty('--'+k,v[k]);r.style.setProperty('--'+k.replace(/[A-Z]/g,function(c){return '-'+c.toLowerCase()}),v[k])}}};
})();</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Per-Word Crossfade - Demo</title>
    <script src="../_lib/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: #fafafa;
        font-family: Inter, system-ui, sans-serif;
      }
      .demo-frame {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 40px;
        width: 1920px;
        height: 1080px;
        padding: 120px 160px;
      }
      /* outgoing phrase — static, fades out */
      .phrase-out {
        display: inline-flex;
        gap: 28px;
        font-size: 128px;
        font-weight: 900;
        letter-spacing: -0.04em;
        line-height: 1;
        color: #71717a;
        font-family: Inter, system-ui, sans-serif;
        position: relative;
      }
      .phrase-out span {
        display: inline-block;
        will-change: opacity;
      }
      /* incoming phrase — the GSAP-animated element */
      .hf-catalog-per-word-crossfade {
        color: #18181b;
        font-family: Inter, system-ui, sans-serif;
        font-weight: 900;
        letter-spacing: -0.04em;
      }
      .hf-catalog-per-word-crossfade {
        display: inline-flex;
        gap: 28px;
        font-size: 128px;
        line-height: 1;
      }
      .hf-catalog-per-word-crossfade span {
        display: inline-block;
        transform: translate(var(--hf-word-x, 0px), var(--hf-word-y, 0px))
          scale(var(--hf-word-scale, 1));
        filter: blur(var(--hf-word-blur, 0px));
        will-change: transform, filter, opacity;
      }
      /* label */
      .demo-label {
        font-size: 26px;
        font-weight: 500;
        color: #a1a1aa;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-top: 24px;
      }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="per-word-crossfade-demo" data-start="0" data-width="1920" data-height="1080" data-duration="5">
      <div class="demo-frame">
        <!-- outgoing phrase: fades out word-by-word -->
        <div class="phrase-out">
          <span data-hft="0">Write</span><span data-hft="1">once</span><span data-hft="2">publish</span><span data-hft="3">anywhere</span>
        </div>
        <!-- incoming phrase: per-word crossfade in -->
        <div class="hf-catalog-per-word-crossfade" data-composition-variables="[
    { &quot;id&quot;: &quot;text&quot;, &quot;type&quot;: &quot;string&quot;, &quot;role&quot;: &quot;content&quot;, &quot;label&quot;: &quot;Text&quot;, &quot;description&quot;: &quot;The line to animate. It is split on whitespace and every word gets its own span, so the stagger picks up the new words.&quot;, &quot;default&quot;: &quot;Create once reuse everywhere&quot; },
    { &quot;id&quot;: &quot;drift&quot;, &quot;type&quot;: &quot;enum&quot;, &quot;role&quot;: &quot;motion&quot;, &quot;label&quot;: &quot;Drift&quot;, &quot;description&quot;: &quot;Scales the vertical offset, so the words cover a shorter or longer run in the same time.&quot;, &quot;default&quot;: &quot;standard&quot;, &quot;options&quot;: [{ &quot;value&quot;: &quot;close&quot;, &quot;label&quot;: &quot;Close&quot; }, { &quot;value&quot;: &quot;standard&quot;, &quot;label&quot;: &quot;Standard&quot; }, { &quot;value&quot;: &quot;far&quot;, &quot;label&quot;: &quot;Far&quot; }] },
    { &quot;id&quot;: &quot;blur&quot;, &quot;type&quot;: &quot;enum&quot;, &quot;role&quot;: &quot;style&quot;, &quot;label&quot;: &quot;Blur&quot;, &quot;description&quot;: &quot;Scales the blur radius the timeline drives, from a light haze to a full smear.&quot;, &quot;default&quot;: &quot;standard&quot;, &quot;options&quot;: [{ &quot;value&quot;: &quot;soft&quot;, &quot;label&quot;: &quot;Soft&quot; }, { &quot;value&quot;: &quot;standard&quot;, &quot;label&quot;: &quot;Standard&quot; }, { &quot;value&quot;: &quot;heavy&quot;, &quot;label&quot;: &quot;Heavy&quot; }] },
    { &quot;id&quot;: &quot;tone&quot;, &quot;type&quot;: &quot;enum&quot;, &quot;role&quot;: &quot;style&quot;, &quot;label&quot;: &quot;Tone&quot;, &quot;description&quot;: &quot;Word colour: ink for light frames, paper for dark ones, accent rides --brand.&quot;, &quot;default&quot;: &quot;ink&quot;, &quot;options&quot;: [{ &quot;value&quot;: &quot;ink&quot;, &quot;label&quot;: &quot;Ink&quot; }, { &quot;value&quot;: &quot;paper&quot;, &quot;label&quot;: &quot;Paper&quot; }, { &quot;value&quot;: &quot;accent&quot;, &quot;label&quot;: &quot;Accent&quot; }] }
  ]">
          <span data-hft="4">Create</span><span data-hft="1">once</span><span data-hft="5">reuse</span><span data-hft="6">everywhere</span>
        </div>
        <div class="demo-label" data-hft="7">per-word crossfade</div>
      </div>
      <script>window.__hfApply&&window.__hfApply()</script><script>
        (function () {
          "use strict";

          var vars =
            window.__hyperframes && window.__hyperframes.getVariables
              ? window.__hyperframes.getVariables()
              : {};

          // Unrecognised overrides return to their declared defaults.
          var drifts = { close: 0.5, standard: 1, far: 1.85 };
          var blurScales = { soft: 0.45, standard: 1, heavy: 2.2 };
          var tones = {
            ink: "#18181b",
            paper: "#fafafa",
            accent: "var(--brand, #34d399)",
          };

          function pick(table, value, fallback) {
            return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
          }

          var drift = drifts[pick(drifts, vars.drift, "standard")];
          var blurScale = blurScales[pick(blurScales, vars.blur, "standard")];
          var tone = tones[pick(tones, vars.tone, "ink")];

          var text = typeof vars.text === "string" ? vars.text.trim() : "";
          var words = (text || "Create once reuse everywhere").split(/\s+/);

          var roots = document.querySelectorAll(".hf-catalog-per-word-crossfade");
          for (var i = 0; i < roots.length; i += 1) {
            var root = roots[i];
            root.style.setProperty("--hf-word-drift", String(drift));
            root.style.setProperty("--hf-word-blur-scale", String(blurScale));
            root.style.setProperty("--hf-word-color", tone);

            while (root.firstChild) {
              root.removeChild(root.firstChild);
            }
            for (var w = 0; w < words.length; w += 1) {
              var span = document.createElement("span");
              span.textContent = words[w];
              root.appendChild(span);
            }
          }
        })();
      </script>
      <script>
        const tl = gsap.timeline({ paused: true });
        const startTime = 0.5;

        // outgoing phrase fades out word-by-word
        tl.to(
          ".phrase-out span",
          {
            opacity: 0,
            duration: 0.25,
            stagger: 0.055,
            ease: "power2.in",
          },
          startTime,
        );

        // incoming phrase fades in word-by-word (the named component)
        tl.fromTo(
          ".hf-catalog-per-word-crossfade span",
          { opacity: 0, "--hf-word-y": "22px", "--hf-word-scale": 0.92, "--hf-word-blur": "5px" },
          {
            opacity: 1,
            "--hf-word-y": "0px",
            "--hf-word-scale": 1,
            "--hf-word-blur": "0px",
            duration: 0.3,
            stagger: 0.055,
            ease: "power3.out",
          },
          startTime + 0.1,
        );

        tl.set({}, {}, 5);
        window.__timelines = window.__timelines || {};
        window.__timelines["per-word-crossfade-demo"] = tl;
      </script>
    </div>
    <style>
      .hf-catalog-per-word-crossfade {
        color: var(--hf-word-color, #18181b);
        font-family: Inter, system-ui, sans-serif;
        font-weight: 900;
        letter-spacing: -0.04em;
      }
      .hf-catalog-per-word-crossfade {
        display: inline-flex;
        gap: 12px;
        font-size: 56px;
        line-height: 1;
      }
      .hf-catalog-per-word-crossfade span {
        display: inline-block;
        transform: translate(
            var(--hf-word-x, 0px),
            calc(var(--hf-word-y, 0px) * var(--hf-word-drift, 1))
          )
          scale(var(--hf-word-scale, 1));
        filter: blur(calc(var(--hf-word-blur, 0px) * var(--hf-word-blur-scale, 1)));
        will-change: transform, filter, opacity;
      }
    </style>
  

</body></html>
