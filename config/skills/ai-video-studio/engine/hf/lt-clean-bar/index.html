<!doctype html>
<html lang="en"><head><style>[data-hf-demo]{visibility:hidden!important}[data-hf-anc]{background:transparent!important;box-shadow:none!important;border-color:transparent!important}</style><script>(function(){
function own(o){try{return (parent!==window&&o&&o[window.name])||null}catch(e){return null}}
function vars(){var d={};document.querySelectorAll('[data-composition-variables]').forEach(function(el){try{JSON.parse(el.getAttribute('data-composition-variables')).forEach(function(v){if(v&&v.id!=null&&'default' in v)d[v.id]=v.default})}catch(e){}});document.querySelectorAll('[data-variable-values]').forEach(function(el){try{var o=JSON.parse(el.getAttribute('data-variable-values'));for(var k in o)d[k]=o[k]}catch(e){}});var o=own(parent.HF_VARS)||{};for(var k in o)if(o[k]!==''&&o[k]!=null)d[k]=o[k];return d}
window.__hyperframes={getVariables:vars};
window.__hfApply=function(){var tx=own(parent.HF_TEXTS)||{};for(var i in tx){if(tx[i]==null)continue;document.querySelectorAll('[data-hft="'+i+'"]').forEach(function(el){el.textContent=tx[i]})}
var v=vars(),r=document.querySelector('[data-composition-id]')||document.documentElement;for(var k in v){if(typeof v[k]==='string'||typeof v[k]==='number'){r.style.setProperty('--'+k,v[k]);r.style.setProperty('--'+k.replace(/[A-Z]/g,function(c){return '-'+c.toLowerCase()}),v[k])}}};
})();</script>
    <meta charset="UTF-8">
    <script src="../_lib/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      body {
        width: 1920px;
        height: 1080px;
        font-family: "Montserrat", sans-serif;
      }

      #root .lt {
        position: absolute;
        left: 120px;
        bottom: 110px;
        display: flex;
        align-items: stretch;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 14px 44px rgba(15, 17, 21, 0.18);
        will-change: clip-path;
      }
      #root .lt-tab {
        width: 12px;
        background: #ff5a36;
        flex-shrink: 0;
      }
      #root .lt-body {
        background: #ffffff;
        padding: 22px 40px 24px 30px;
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      #root .lt-name {
        font-size: 52px;
        font-weight: 700;
        color: #0f1115;
        line-height: 1.06;
        letter-spacing: -0.015em;
        white-space: nowrap;
      }
      #root .lt-role {
        font-size: 27px;
        font-weight: 400;
        color: #5a6170;
        line-height: 1.2;
        letter-spacing: 0.01em;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="lt-clean-bar" data-width="1920" data-height="1080" data-start="0" data-duration="4.8">
      <div id="lt-clip" class="clip" data-start="0" data-duration="4.8" data-track-index="0">
        <div id="lt" class="lt">
          <div id="lt-tab" class="lt-tab"></div>
          <div class="lt-body">
            <div id="lt-name" class="lt-name" data-hft="0">Dr. Maya Chen</div>
            <div id="lt-role" class="lt-role" data-hft="1">Host · Neuroscientist</div>
          </div>
        </div>
      </div>
    </div>

    <script>window.__hfApply&&window.__hfApply()</script><script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var card = document.getElementById("lt");
      var tab = document.getElementById("lt-tab");
      var nameEl = document.getElementById("lt-name");
      var role = document.getElementById("lt-role");

      // Card wipes in from the left (clip-path), accent tab grows, text rises with a small stagger.
      gsap.set(card, { clipPath: "inset(0 100% 0 0)" });
      gsap.set(tab, { scaleY: 0, transformOrigin: "50% 0%" });
      gsap.set(nameEl, { y: 22, opacity: 0 });
      gsap.set(role, { y: 22, opacity: 0 });

      tl.to(card, { clipPath: "inset(0 0% 0 0)", duration: 0.55, ease: "power3.out" }, 0.1);
      tl.to(tab, { scaleY: 1, duration: 0.45, ease: "power2.out" }, 0.28);
      tl.to(nameEl, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.34);
      tl.to(role, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.44);

      // Exit: settle out, then hard kill the inner element.
      tl.to(card, { y: 18, opacity: 0, duration: 0.35, ease: "power2.in" }, 4.3);
      tl.set(card, { visibility: "hidden" }, 4.75);

      window.__timelines["lt-clean-bar"] = tl;
    </script>
  

</body></html>
