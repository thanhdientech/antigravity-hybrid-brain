    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Focus Blur Resolve - Demo</title>
    <script src="../_lib/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: #f7f7f8;
        font-family: Inter, system-ui, sans-serif;
      }
      .demo-frame {
        display: grid;
        place-items: center;
        min-width: 900px;
        min-height: 500px;
        padding: 64px;
        /* ponytail: scale wrapper (not a GSAP target) to fill ~65% of frame */
        transform: scale(2.8);
      }
      .hf-catalog-focus-blur-resolve {
        color: #18181b;
        font-family: Inter, system-ui, sans-serif;
        font-weight: 900;
        letter-spacing: -0.04em;
      }
      .hf-catalog-focus-blur-resolve {
        display: inline-flex;
        gap: 12px;
        font-size: 56px;
        line-height: 1;
      }
      .hf-catalog-focus-blur-resolve span {
        display: inline-block;
        transform: translate(var(--hf-word-x, 0px), var(--hf-word-y, 0px))
          scale(var(--hf-word-scale, 1));
        filter: blur(var(--hf-word-blur, 0px));
        will-change: transform, filter, opacity;
      }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="focus-blur-resolve-demo" data-start="0" data-width="1920" data-height="1080" data-duration="5">
      <div class="demo-frame">
        <div class="hf-catalog-focus-blur-resolve" data-composition-variables="[
    { &quot;id&quot;: &quot;tone&quot;, &quot;type&quot;: &quot;enum&quot;, &quot;role&quot;: &quot;style&quot;, &quot;label&quot;: &quot;Tone&quot;, &quot;description&quot;: &quot;Word colour: ink for light frames, paper for dark ones, accent rides --brand.&quot;, &quot;default&quot;: &quot;ink&quot;, &quot;options&quot;: [{ &quot;value&quot;: &quot;ink&quot;, &quot;label&quot;: &quot;Ink&quot; }, { &quot;value&quot;: &quot;paper&quot;, &quot;label&quot;: &quot;Paper&quot; }, { &quot;value&quot;: &quot;accent&quot;, &quot;label&quot;: &quot;Accent&quot; }] },
    { &quot;id&quot;: &quot;size&quot;, &quot;type&quot;: &quot;enum&quot;, &quot;role&quot;: &quot;style&quot;, &quot;label&quot;: &quot;Size&quot;, &quot;description&quot;: &quot;Type size of the words, from a caption-scale line to a full display card.&quot;, &quot;default&quot;: &quot;standard&quot;, &quot;options&quot;: [{ &quot;value&quot;: &quot;compact&quot;, &quot;label&quot;: &quot;Compact&quot; }, { &quot;value&quot;: &quot;standard&quot;, &quot;label&quot;: &quot;Standard&quot; }, { &quot;value&quot;: &quot;display&quot;, &quot;label&quot;: &quot;Display&quot; }] },
    { &quot;id&quot;: &quot;blur&quot;, &quot;type&quot;: &quot;enum&quot;, &quot;role&quot;: &quot;style&quot;, &quot;label&quot;: &quot;Blur&quot;, &quot;description&quot;: &quot;Scales the blur radius the timeline drives, so the focus pull starts as a light haze or a full smear.&quot;, &quot;default&quot;: &quot;standard&quot;, &quot;options&quot;: [{ &quot;value&quot;: &quot;soft&quot;, &quot;label&quot;: &quot;Soft&quot; }, { &quot;value&quot;: &quot;standard&quot;, &quot;label&quot;: &quot;Standard&quot; }, { &quot;value&quot;: &quot;heavy&quot;, &quot;label&quot;: &quot;Heavy&quot; }] }
  ]">
          <span data-hft="0">Crystal</span><span data-hft="1">clear</span>
        </div>
      </div>
      <script>window.__hfApply&&window.__hfApply()</script><script>
        (function () {
          "use strict";

          var vars =
            window.__hyperframes && window.__hyperframes.getVariables
              ? window.__hyperframes.getVariables()
              : {};

          // Unrecognised overrides return to their declared defaults.
          function pick(table, value, fallback) {
            return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
          }

          var tones = { ink: "#18181b", paper: "#fafafa", accent: "var(--brand, #34d399)" };
          var sizes = { compact: "40px", standard: "56px", display: "84px" };
          var blurScales = { soft: 0.45, standard: 1, heavy: 2.2 };

          var tone = tones[pick(tones, vars.tone, "ink")];
          var size = sizes[pick(sizes, vars.size, "standard")];
          var blurScale = blurScales[pick(blurScales, vars.blur, "standard")];

          var roots = document.querySelectorAll(".hf-catalog-focus-blur-resolve");
          for (var i = 0; i < roots.length; i += 1) {
            roots[i].style.setProperty("--hf-word-color", tone);
            roots[i].style.setProperty("--hf-word-size", size);
            roots[i].style.setProperty("--hf-word-blur-scale", String(blurScale));
          }
        })();
      </script>
      <script>
        const tl = gsap.timeline({ paused: true });
        const startTime = 0.5;
        tl.fromTo(
          ".hf-catalog-focus-blur-resolve span",
          { opacity: 0, "--hf-word-scale": 1.08, "--hf-word-blur": "16px" },
          {
            opacity: 1,
            "--hf-word-scale": 1,
            "--hf-word-blur": "0px",
            duration: 0.52,
            stagger: 0.05,
            ease: "power3.out",
          },
          startTime,
        );
        tl.set({}, {}, 5);
        window.__timelines = window.__timelines || {};
        window.__timelines["focus-blur-resolve-demo"] = tl;
      </script>
    </div>
