          var off = reach(ASIDE, 0, 0, W, H) + 180 * unit;
          var END = { x: ASIDE.x + away.x * off, y: ASIDE.y + away.y * off };
          var START = { x: first.x + 0.3 * W, y: H * 1.25 };

          function mix(a, b, u) {
            return { x: a.x + (b.x - a.x) * u, y: a.y + (b.y - a.y) * u };
          }

          // Returns the nib position and how far off the paper it is (0 = touching).
          function penAt(t) {
            if (t <= T_LAND) return { p: mix(START, first, glide(clamp01(t / T_LAND))), lift: 1 };
            if (t <= T_DRAW)
              return { p: first, lift: 1 - clamp01((t - T_LAND) / (T_DRAW - T_LAND)) };
            for (var i = 0; i < windows.length; i++) {
              var w = windows[i];
              if (t <= w.end)
                return { p: nibOf(strokes[i], (t - w.start) / (w.end - w.start)), lift: 0 };
              var next = windows[i + 1];
              if (next && t < next.start) {
                var u = (t - w.end) / (next.start - w.end);
                return {
                  p: mix(nibOf(strokes[i], 1), nibOf(strokes[i + 1], 0), hop(u)),
                  lift: Math.sin(Math.PI * u),
                };
              }
            }
            if (t <= T_EXIT) {
              var a = clamp01((t - T_LIFT) / ASIDE_TIME);
              return { p: mix(endPoint, ASIDE, aside(a)), lift: Math.min(1, a * 2.5) };
            }
            return {
              p: mix(ASIDE, END, leave(clamp01((t - T_EXIT) / (duration - T_EXIT)))),
              lift: 1,
            };
          }

          function render(t) {
            strokes.forEach(function (s, i) {
              var w = windows[i];
              s.el.setAttribute("d", outline(drawnTo(s, (t - w.start) / (w.end - w.start))));
            });
            var state = penAt(t);
            var lift = state.lift;
            pen.style.transform =
              "translate(" + state.p.x.toFixed(2) + "px," + state.p.y.toFixed(2) + "px)";
            penBody.setAttribute(
              "transform",
              "scale(" +
                ((0.85 + 0.07 * lift) * unit).toFixed(4) +
                ") rotate(" +
                (-4 * lift).toFixed(2) +
                ")",
            );
            pen.style.filter =
              "drop-shadow(0 " +
              ((3 + 7 * lift) * unit).toFixed(1) +
              "px " +
              ((4 + 8 * lift) * unit).toFixed(1) +
              "px rgba(0,0,0," +
              (0.3 - 0.1 * lift).toFixed(3) +
              "))";
          }

          var clock = { t: 0 };
          var tl = gsap.timeline({ paused: true });
          tl.to(
            clock,
            {
              t: duration,
              duration: duration,
              ease: "none",
              onUpdate: function () {
                render(clock.t);
              },
            },
            0,
          );
          render(0);
          tl.seek(0);
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = tl;
        })();
      </script>
    </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      // The chart settles before the pen enters at 0.35s.
      tl.fromTo(
        ".bar",
        { scaleY: 0.2 },
        { scaleY: 1, duration: 0.28, ease: "power3.out", stagger: 0.01 },
        0,
      );
      window.__timelines["cursor-annotate-demo"] = tl;
    </script>
