<!doctype html>
<html lang="en"><head><style>[data-hf-demo]{visibility:hidden!important}[data-hf-anc]{background:transparent!important;box-shadow:none!important;border-color:transparent!important}</style><script>(function(){
function own(o){try{return (parent!==window&&o&&o[window.name])||null}catch(e){return null}}
function vars(){var d={};document.querySelectorAll('[data-composition-variables]').forEach(function(el){try{JSON.parse(el.getAttribute('data-composition-variables')).forEach(function(v){if(v&&v.id!=null&&'default' in v)d[v.id]=v.default})}catch(e){}});document.querySelectorAll('[data-variable-values]').forEach(function(el){try{var o=JSON.parse(el.getAttribute('data-variable-values'));for(var k in o)d[k]=o[k]}catch(e){}});var o=own(parent.HF_VARS)||{};for(var k in o)if(o[k]!==''&&o[k]!=null)d[k]=o[k];return d}
window.__hyperframes={getVariables:vars};
window.__hfApply=function(){var tx=own(parent.HF_TEXTS)||{};for(var i in tx){if(tx[i]==null)continue;document.querySelectorAll('[data-hft="'+i+'"]').forEach(function(el){el.textContent=tx[i]})}
var v=vars(),r=document.querySelector('[data-composition-id]')||document.documentElement;for(var k in v){if(typeof v[k]==='string'||typeof v[k]==='number'){r.style.setProperty('--'+k,v[k]);r.style.setProperty('--'+k.replace(/[A-Z]/g,function(c){return '-'+c.toLowerCase()}),v[k])}}};
})();</script>
    <meta charset="UTF-8">
    <script src="../_lib/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      body {
        width: 1920px;
        height: 1080px;
        font-family: "Montserrat", sans-serif;
      }

      #root .lt {
        position: absolute;
        left: 130px;
        bottom: 122px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }
      #root .lt-namewrap {
        position: relative;
        overflow: hidden;
        padding: 2px 0;
      }
      #root .lt-name {
        font-size: 72px;
        font-weight: 900;
        color: #ffffff;
        line-height: 0.98;
        letter-spacing: -0.02em;
        white-space: nowrap;
        text-shadow: 0 2px 22px rgba(0, 0, 0, 0.45);
        will-change: clip-path;
      }
      #root .lt-sweep {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 8px;
        background: #ffd23f;
      }
      #root .lt-role {
        font-size: 28px;
        font-weight: 500;
        color: #e7eaf0;

  </head>
  <body>
    <div id="root" data-composition-id="lt-mask-reveal" data-width="1920" data-height="1080" data-start="0" data-duration="4.8">
      <div id="lt-clip" class="clip" data-start="0" data-duration="4.8" data-track-index="0">
        <div id="lt" class="lt">
          <div class="lt-namewrap">
            <div id="lt-name" class="lt-name" data-hft="0">Dr. Maya Chen</div>
            <div id="lt-sweep" class="lt-sweep"></div>
          </div>
          <div id="lt-role" class="lt-role" data-hft="1">Host · Neuroscientist</div>
        </div>
      </div>
    </div>

    <script>window.__hfApply&&window.__hfApply()</script><script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var wrap = document.getElementById("lt");
      var nameEl = document.getElementById("lt-name");
      var sweep = document.getElementById("lt-sweep");
      var role = document.getElementById("lt-role");

      // An accent sweep crosses left→right; the name is revealed by a clip-path wipe behind it; role fades up.
      // Sweep travel: left:"100%" was parent-relative (offsetParent = .lt-namewrap). Since the sweep is
      // only 8px wide, xPercent would travel just 8px, so translate by the container width in pixels instead.
      // The .lt-namewrap shrink-wraps the name "Dr. Maya Chen" to 536px (no horizontal padding/border, so
      // clientWidth == content width), which is exactly what left:"100%" resolved to.
      var SWEEP_TRAVEL = 536;
      gsap.set(nameEl, { clipPath: "inset(0 100% 0 0)" });
      gsap.set(sweep, { x: 0, opacity: 0 });
      gsap.set(role, { y: 14, opacity: 0 });

      tl.to(sweep, { opacity: 1, duration: 0.12, ease: "none" }, 0.1);
      tl.to(sweep, { x: SWEEP_TRAVEL, duration: 0.55, ease: "power2.inOut" }, 0.12);
      tl.to(nameEl, { clipPath: "inset(0 0% 0 0)", duration: 0.5, ease: "power2.inOut" }, 0.16);
      tl.to(sweep, { opacity: 0, duration: 0.15, ease: "none" }, 0.6);
      tl.to(role, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.55);

      // Exit: name un-wipes, role fades, hard kill.
      tl.to(role, { opacity: 0, duration: 0.3, ease: "power2.in" }, 4.25);
      tl.to(nameEl, { clipPath: "inset(0 0 0 100%)", duration: 0.4, ease: "power2.in" }, 4.3);
      tl.set(wrap, { visibility: "hidden" }, 4.75);

      window.__timelines["lt-mask-reveal"] = tl;
    </script>
  

</body></html>
