              kraft: "color-mix(in srgb, var(--accent-2, #b98a4e) 55%, #7d5a34)",

            var TORN_AMP = 1.1;
            var SIDE_STEPS = 6;
            var SIDES = [
              [0, 0, 100, 0, 0, 1],
              [100, 0, 100, 100, -1, 0],
              [100, 100, 0, 100, 0, -1],

            function tornPolygon(w, h) {

              var jitterY = range(-1, 1);

              var cy = y + h / 2;

              var uy = Math.sin(rad);

              // upward, that eases out while the exit eases in.
              var arcAmp = ux > 0 ? -9 : 9;
              var rotation = range(8, 15) * (next() < 0.5 ? -1 : 1);

              // Monotonic starts: the first scrap lifts at FIRST_LIFT, the
              // rest follow in index order with a seeded offset.
              var startAt = i === 0 ? FIRST_LIFT : FIRST_LIFT + (i - range(0, 0.4)) * startGap;

                x: x,
                y: y,
                w: w,
                h: h,
                poly: poly,
                tone: panelTone,
                exitX: ux * travelPct,
                exitY: uy * travelPct,
                arcX: -uy * arcAmp,
                arcY: ux * arcAmp,
                rotation: rotation,
                startAt: startAt,
              });
            }

            // DOM per scrap: panel (exit, tilt, shadow) > arc (hop, deckle) >
            // fill (torn clip, colour) > grain. Scraps that lift first sit on top.
            var panelFrag = document.createDocumentFragment();
            var panelEls = panels.map(function (p, idx) {
              var el = document.createElement("div");
              el.className = "pcr-panel";
              el.style.left = p.x + "%";
              el.style.top = p.y + "%";
              el.style.width = p.w + "%";
              el.style.height = p.h + "%";
              el.style.zIndex = String(PANEL_COUNT - idx);

              var arc = document.createElement("div");
              arc.className = "pcr-panel-arc";
              var fill = document.createElement("div");
              fill.className = "pcr-panel-fill";
              fill.style.clipPath = "polygon(" + p.poly + ")";

              grain.className = "pcr-panel-grain";
              fill.appendChild(grain);

            panels.forEach(function (p, idx) {
              tl.fromTo(
                panelEls[idx],
                { x: 0, y: 0, rotation: 0, "--lift": 0 },
                {

                  y: p.exitY + "cqh",
                  rotation: p.rotation,

                  ease: "power1.out",
                  force3D: false,

      (function () {
        // Contour lines of one summit: nested closed rings whose radius
        // wanders with a few fixed sines, so the drawing is deterministic.
        function contours() {
          var paths = "";
          for (var k = 0; k < 16; k += 1) {
            var d = "";
            for (var a = 0; a <= 120; a += 1) {
              var th = (a / 120) * Math.PI * 2;
              var r =
                (34 + k * 46) *
                (1 +
                  0.2 * Math.sin(2 * th + 0.6 + k * 0.09) +
                  0.1 * Math.sin(3 * th + 1.9 - k * 0.07) +
                  0.05 * Math.sin(5 * th + k * 0.35));
              d +=
                (a ? "L" : "M") +
                (1390 + r * Math.cos(th)).toFixed(1) +
                " " +
                (420 + r * 0.82 * Math.sin(th)).toFixed(1);
            }
            paths +=
              '<path d="' + d + 'Z"' + (k % 5 === 4 ? ' class="demo-topo-index"' : "") + "/>";
          }
          return '<svg width="1920" height="1080" viewBox="0 0 1920 1080">' + paths + "</svg>";
        }
        // Elements inside an inert <template> are not in the live document,
        // so they must be reached through the template's own content
        // fragment, never document.getElementById.
        document
          .querySelector('template[data-slot="paper-collage-reveal-content"]')
          .content.getElementById("demo-topo").innerHTML = contours();

        window.__timelines = window.__timelines || {};
        window.__timelines["paper-collage-reveal-demo"] = gsap.timeline({ paused: true });
      })();
