<html lang="en"><head><style>[data-hf-demo]{visibility:hidden!important}[data-hf-anc]{background:transparent!important;box-shadow:none!important;border-color:transparent!important}</style><script>(function(){
function own(o){try{return (parent!==window&&o&&o[window.name])||null}catch(e){return null}}
function vars(){var d={};document.querySelectorAll('[data-composition-variables]').forEach(function(el){try{JSON.parse(el.getAttribute('data-composition-variables')).forEach(function(v){if(v&&v.id!=null&&'default' in v)d[v.id]=v.default})}catch(e){}});document.querySelectorAll('[data-variable-values]').forEach(function(el){try{var o=JSON.parse(el.getAttribute('data-variable-values'));for(var k in o)d[k]=o[k]}catch(e){}});var o=own(parent.HF_VARS)||{};for(var k in o)if(o[k]!==''&&o[k]!=null)d[k]=o[k];return d}
window.__hyperframes={getVariables:vars};
window.__hfApply=function(){var tx=own(parent.HF_TEXTS)||{};for(var i in tx){if(tx[i]==null)continue;document.querySelectorAll('[data-hft="'+i+'"]').forEach(function(el){el.textContent=tx[i]})}
var v=vars(),r=document.querySelector('[data-composition-id]')||document.documentElement;for(var k in v){if(typeof v[k]==='string'||typeof v[k]==='number'){r.style.setProperty('--'+k,v[k]);r.style.setProperty('--'+k.replace(/[A-Z]/g,function(c){return '-'+c.toLowerCase()}),v[k])}}};
})();</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Bottom Up Letters - Demo</title>
    <script src="../_lib/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: #16120e;
        color: #f7ead6;
        font-family: Inter, system-ui, sans-serif;
      }
      .hf-bottom-up-letters {
        display: inline-block;
        font-size: 180px; /* ponytail: scaled up from 126px — fills ~65% of 1920px frame width */
        line-height: 1;
        font-weight: 900;
        letter-spacing: -0.02em;
      }
      .hf-bottom-up-letters-char {
        display: inline-block;
        opacity: 0;
        transform: translate3d(0, 0.85em, 0);
        will-change: transform, opacity;
      }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="bottom-up-letters-demo" data-width="1920" data-height="1080" data-duration="4" data-composition-variables="[
  { &quot;id&quot;: &quot;unit&quot;, &quot;type&quot;: &quot;enum&quot;, &quot;role&quot;: &quot;content&quot;, &quot;label&quot;: &quot;Split unit&quot;, &quot;description&quot;: &quot;What each animated span holds. Letter staggers glyph by glyph, word keeps whole words intact.&quot;, &quot;default&quot;: &quot;letter&quot;, &quot;options&quot;: [{ &quot;value&quot;: &quot;letter&quot;, &quot;label&quot;: &quot;Letter&quot; }, { &quot;value&quot;: &quot;word&quot;, &quot;label&quot;: &quot;Word&quot; }] },
  { &quot;id&quot;: &quot;direction&quot;, &quot;type&quot;: &quot;enum&quot;, &quot;role&quot;: &quot;motion&quot;, &quot;label&quot;: &quot;Direction&quot;, &quot;description&quot;: &quot;Where each span starts. Up starts below the baseline and rises, down starts above and drops.&quot;, &quot;default&quot;: &quot;up&quot;, &quot;options&quot;: [{ &quot;value&quot;: &quot;up&quot;, &quot;label&quot;: &quot;Up&quot; }, { &quot;value&quot;: &quot;down&quot;, &quot;label&quot;: &quot;Down&quot; }] },
  { &quot;id&quot;: &quot;travel&quot;, &quot;type&quot;: &quot;enum&quot;, &quot;role&quot;: &quot;motion&quot;, &quot;label&quot;: &quot;Travel&quot;, &quot;description&quot;: &quot;How far each span starts from its resting position, from 0.45em to 1.5em.&quot;, &quot;default&quot;: &quot;standard&quot;, &quot;options&quot;: [{ &quot;value&quot;: &quot;close&quot;, &quot;label&quot;: &quot;Close&quot; }, { &quot;value&quot;: &quot;standard&quot;, &quot;label&quot;: &quot;Standard&quot; }, { &quot;value&quot;: &quot;far&quot;, &quot;label&quot;: &quot;Far&quot; }] }
]">
      <div class="hf-bottom-up-letters" data-hft="0">Build with motion</div>
      <script>window.__hfApply&&window.__hfApply()</script><script>
        (function () {
          "use strict";

          var vars =
            window.__hyperframes && window.__hyperframes.getVariables
              ? window.__hyperframes.getVariables()
              : {};

          // Unrecognised overrides return to their declared defaults.
          function pick(table, value, fallback) {
            return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
          }

          var travels = { close: "0.45em", standard: "0.85em", far: "1.5em" };
          var directions = { up: "1", down: "-1" };
          var units = { letter: true, word: true };

          var travel = travels[pick(travels, vars.travel, "standard")];
          var direction = directions[pick(directions, vars.direction, "up")];
          var unit = pick(units, vars.unit, "letter");

          document.querySelectorAll(".hf-bottom-up-letters").forEach((el) => {
            el.style.setProperty("--hf-letters-travel", travel);
            el.style.setProperty("--hf-letters-direction", direction);
            if (el.dataset.hfLettersReady === "1") return;
            const text = el.textContent || "";
            el.textContent = "";
            const parts = unit === "word" ? text.split(/(\s+)/) : Array.from(text);
            for (const part of parts) {
              if (part === "") continue;
              if (unit === "word" && /^\s+$/.test(part)) {
                el.appendChild(document.createTextNode(part));
                continue;
              }
              const span = document.createElement("span");
              span.className = "hf-bottom-up-letters-char";
              span.textContent = part === " " ? "\u00a0" : part;
              el.appendChild(span);
            }
            el.dataset.hfLettersReady = "1";
          });
        })();
      </script>
      <script>
        document.querySelectorAll(".hf-bottom-up-letters").forEach((el) => {
          const text = el.textContent || "";
          el.textContent = "";
          for (const char of text) {
            const span = document.createElement("span");
            span.className = "hf-bottom-up-letters-char";
            span.textContent = char === " " ? "\u00a0" : char;
            el.appendChild(span);
          }
        });
        const tl = gsap.timeline({ paused: true });
        tl.to(
          ".hf-bottom-up-letters-char",
          { opacity: 1, y: 0, duration: 0.48, ease: "back.out(1.7)", stagger: 0.025 },
          0.45,
        );
        window.__timelines = window.__timelines || {};
        window.__timelines["bottom-up-letters-demo"] = tl;
      </script>
    </div>
    <style>
       element below; the runtime collects every element carrying
        data-composition-variables, not just the document root. The script reads each
        value, falls back to the declared default on anything missing or
        unrecognised, and either changes how the text is split or writes a custom
        property the CSS consumes. The timeline recipe below is untouched by them: it
        still tweens opacity and y back to rest, and these decide what a single
        stagger step covers and where rest is travelled from.

          - unit (letter | word, default letter): what each animated span holds.
            letter staggers glyph by glyph; word keeps whole words intact, so a long
            line reads instead of shimmers.
          - direction (up | down, default up): where the spans start. up starts
            below the baseline and rises into place, down starts above and drops.
          - travel (close | standard | far, default standard): how far each span
            starts from rest, from 0.45em through 0.85em to 1.5em.

        On every default the result is identical to the original: one span per
        character, each starting 0.85em below the baseline.
      -->

      <style
        data-composition-variables='[
        { "id": "unit", "type": "enum", "role": "content", "label": "Split unit", "description": "What each animated span holds. Letter staggers glyph by glyph, word keeps whole words intact.", "default": "letter", "options": [{ "value": "letter", "label": "Letter" }, { "value": "word", "label": "Word" }] },
        { "id": "direction", "type": "enum", "role": "motion", "label": "Direction", "description": "Where each span starts. Up starts below the baseline and rises, down starts above and drops.", "default": "up", "options": [{ "value": "up", "label": "Up" }, { "value": "down", "label": "Down" }] },
        { "id": "travel", "type": "enum", "role": "motion", "label": "Travel", "description": "How far each span starts from its resting position, from 0.45em to 1.5em.", "default": "standard", "options": [{ "value": "close", "label": "Close" }, { "value": "standard", "label": "Standard" }, { "value": "far", "label": "Far" }] }
      ]'
      >
        .hf-bottom-up-letters {
          display: inline-block;
        }
        .hf-bottom-up-letters-char {
          display: inline-block;
          opacity: 0;
          transform: translate3d(
            0,
            calc(var(--hf-letters-travel, 0.85em) * var(--hf-letters-direction, 1)),
            0
          );
          will-change: transform, opacity;
        }
    </style>
