<html lang="en"><head><style>[data-hf-demo]{visibility:hidden!important}[data-hf-anc]{background:transparent!important;box-shadow:none!important;border-color:transparent!important}</style><script>(function(){
function own(o){try{return (parent!==window&&o&&o[window.name])||null}catch(e){return null}}
function vars(){var d={};document.querySelectorAll('[data-composition-variables]').forEach(function(el){try{JSON.parse(el.getAttribute('data-composition-variables')).forEach(function(v){if(v&&v.id!=null&&'default' in v)d[v.id]=v.default})}catch(e){}});document.querySelectorAll('[data-variable-values]').forEach(function(el){try{var o=JSON.parse(el.getAttribute('data-variable-values'));for(var k in o)d[k]=o[k]}catch(e){}});var o=own(parent.HF_VARS)||{};for(var k in o)if(o[k]!==''&&o[k]!=null)d[k]=o[k];return d}

window.__hfApply=function(){var tx=own(parent.HF_TEXTS)||{};for(var i in tx){if(tx[i]==null)continue;document.querySelectorAll('[data-hft="'+i+'"]').forEach(function(el){el.textContent=tx[i]})}
var v=vars(),r=document.querySelector('[data-composition-id]')||document.documentElement;for(var k in v){if(typeof v[k]==='string'||typeof v[k]==='number'){r.style.setProperty('--'+k,v[k]);r.style.setProperty('--'+k.replace(/[A-Z]/g,function(c){return '-'+c.toLowerCase()}),v[k])}}};

    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Number Pop In - Demo</title>
    <script src="../_lib/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: #f7f7f8;
        font-family: Inter, system-ui, sans-serif;
      }
      .demo-frame {
        display: grid;
        place-items: center;
        min-width: 760px;
        min-height: 480px;
        padding: 56px;
        /* ponytail: scale non-GSAP wrapper so the stat fills ~65% of the frame */
        transform: scale(1.37);
      }
      .hf-transition-number-pop-in {
        display: inline-flex;
        align-items: baseline;
        gap: 2px;
        color: #18181b;
        font-family: Inter, system-ui, sans-serif;
        font-weight: 900;
        letter-spacing: -0.04em;
      }
      .hf-transition-number-pop-in span {
        font-size: 96px;
        line-height: 0.9;
        filter: blur(var(--hf-number-blur, 0px));
        transform: translateY(var(--hf-number-y, 0px)) scale(var(--hf-number-scale, 1));
        will-change: transform, filter, opacity;
      }
      .hf-transition-number-pop-in small {
        margin-left: 4px;
        color: #71717a;
        font-size: 42px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="number-pop-in-demo" data-start="0" data-width="1920" data-height="1080" data-duration="5">
      <div class="demo-frame">
        <div class="hf-transition-number-pop-in" data-composition-variables="[
    { &quot;id&quot;: &quot;value&quot;, &quot;type&quot;: &quot;string&quot;, &quot;role&quot;: &quot;content&quot;, &quot;label&quot;: &quot;Value&quot;, &quot;description&quot;: &quot;The number itself. Every character becomes its own span, so the stagger still lands character by character.&quot;, &quot;default&quot;: &quot;5.7&quot; },
    { &quot;id&quot;: &quot;unit&quot;, &quot;type&quot;: &quot;string&quot;, &quot;role&quot;: &quot;content&quot;, &quot;label&quot;: &quot;Unit&quot;, &quot;description&quot;: &quot;Small suffix printed after the number. Pass an empty string to drop it.&quot;, &quot;default&quot;: &quot;k&quot; },
    { &quot;id&quot;: &quot;lift&quot;, &quot;type&quot;: &quot;enum&quot;, &quot;role&quot;: &quot;motion&quot;, &quot;label&quot;: &quot;Lift&quot;, &quot;description&quot;: &quot;Scales the offset the timeline drives, so the characters cover a shorter or longer run in the same time.&quot;, &quot;default&quot;: &quot;standard&quot;, &quot;options&quot;: [{ &quot;value&quot;: &quot;close&quot;, &quot;label&quot;: &quot;Close&quot; }, { &quot;value&quot;: &quot;standard&quot;, &quot;label&quot;: &quot;Standard&quot; }, { &quot;value&quot;: &quot;far&quot;, &quot;label&quot;: &quot;Far&quot; }] },
    { &quot;id&quot;: &quot;tone&quot;, &quot;type&quot;: &quot;enum&quot;, &quot;role&quot;: &quot;style&quot;, &quot;label&quot;: &quot;Tone&quot;, &quot;description&quot;: &quot;Number colour: ink for light frames, paper for dark ones, accent rides --brand.&quot;, &quot;default&quot;: &quot;ink&quot;, &quot;options&quot;: [{ &quot;value&quot;: &quot;ink&quot;, &quot;label&quot;: &quot;Ink&quot; }, { &quot;value&quot;: &quot;paper&quot;, &quot;label&quot;: &quot;Paper&quot; }, { &quot;value&quot;: &quot;accent&quot;, &quot;label&quot;: &quot;Accent&quot; }] }
  ]">
          <span>5</span><span>.</span><span>7</span><small>k</small>
        </div>
      </div>
      <script>window.__hfApply&&window.__hfApply()</script><script>
        (function () {
          "use strict";

          var vars =
            window.__hyperframes && window.__hyperframes.getVariables
              ? window.__hyperframes.getVariables()
              : {};

          // Unrecognised overrides return to their declared defaults.
          var lifts = { close: 0.5, standard: 1, far: 1.75 };
          var tones = {
            ink: { number: "#18181b", unit: "#71717a" },
            paper: { number: "#fafafa", unit: "#a1a1aa" },
            accent: { number: "var(--brand, #34d399)", unit: "var(--brand, #34d399)" },
          };

          function text(value, fallback) {
            return typeof value === "string" ? value : fallback;
          }

          var value = text(vars.value, "5.7");
          if (value === "") value = "5.7";
          var unit = text(vars.unit, "k");
          var lift = Object.prototype.hasOwnProperty.call(lifts, vars.lift)
            ? vars.lift
            : "standard";
          var tone = Object.prototype.hasOwnProperty.call(tones, vars.tone) ? vars.tone : "ink";

          var roots = document.querySelectorAll(".hf-transition-number-pop-in");
          for (var i = 0; i < roots.length; i += 1) {
            var root = roots[i];
            root.style.setProperty("--hf-number-lift", String(lifts[lift]));
            root.style.setProperty("--hf-number-color", tones[tone].number);
            root.style.setProperty("--hf-number-unit-color", tones[tone].unit);

            var next = [];
            for (var c = 0; c < value.length; c += 1) {
              var span = document.createElement("span");
              span.textContent = value.charAt(c);
              next.push(span);
            }
            if (unit !== "") {
              var small = document.createElement("small");
              small.textContent = unit;
              next.push(small);
            }
            root.replaceChildren.apply(root, next);
          }
        })();
      </script>
      <script>
        const tl = gsap.timeline({ paused: true });
        const startTime = 0.5;
        tl.fromTo(
          ".hf-transition-number-pop-in span, .hf-transition-number-pop-in small",
          {
            opacity: 0,
            "--hf-number-y": "24px",
            "--hf-number-scale": 0.82,
            "--hf-number-blur": "8px",
          },
          {
            opacity: 1,
            "--hf-number-y": "0px",
            "--hf-number-scale": 1,
            "--hf-number-blur": "0px",
            duration: 0.34,
            stagger: 0.055,
            ease: "back.out(1.8)",
          },
          startTime,
        );
        tl.set({}, {}, 5);
        window.__timelines = window.__timelines || {};
        window.__timelines["number-pop-in-demo"] = tl;
      </script>
    </div>
