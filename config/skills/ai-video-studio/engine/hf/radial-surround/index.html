      <div id="root" data-composition-id="radial-surround" data-duration="5" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            container-type: size;
            isolation: isolate;
            background: var(--bg, transparent);
            color: var(--fg, #f8fafc);
            font-family: var(--font-mono, ui-monospace, "SF Mono", Menlo, Consolas, monospace);
            pointer-events: none;
          }

          .rs-clip {
            position: absolute;
            inset: 0;
            overflow: hidden;
          }

          .rs-stage {
            position: absolute;
            inset: 0;
            will-change: transform, opacity;
          }

          .rs-center-layer {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
          }

          .rs-center {
            display: grid;
            place-items: center;
            will-change: transform, opacity;

            max-width: 34cqw;

            border-radius: var(--radius, 2.2cqmin);
            background: color-mix(in srgb, var(--surface, #131a24) 94%, var(--rs-accent));
            box-shadow: 0 3cqh 9cqh color-mix(in srgb, var(--bg, #000000) 40%, transparent);
          }

          .rs-card-label {
            overflow: hidden;
            color: var(--fg, #f8fafc);
            font-family: var(
              --font-display,
              var(--font-body, ui-sans-serif, system-ui, sans-serif)
            );
            font-size: var(--rs-center-font, 4cqmin);
            font-weight: 600;
            line-height: 1.15;
            letter-spacing: 0.04em;
            text-align: center;
            white-space: nowrap;
          }

          .rs-ring {
            position: absolute;
            inset: 0;
          }

          /* Positioning wrapper: the baked ring offsets live in the --rs-ox

             chip's unitless scale and opacity are the only transforms. */

            left: calc(50% + var(--rs-ox, 0cqw));
            width: max-content;
            transform: translate(-50%, -50%);
            will-change: top, left;
          }

          .rs-chip {
            padding: 1.15cqmin 2.1cqmin;
            border: 0.14cqmin solid var(--border, #475569);
            border-radius: 0.6cqmin;

            font-weight: 500;

            letter-spacing: 0.16em;
            text-transform: uppercase;

            will-change: transform, opacity;

              transparent 60%,
