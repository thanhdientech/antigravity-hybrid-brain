<html lang="en"><head><style>[data-hf-demo]{visibility:hidden!important}[data-hf-anc]{background:transparent!important;box-shadow:none!important;border-color:transparent!important}</style><script>(function(){
function own(o){try{return (parent!==window&&o&&o[window.name])||null}catch(e){return null}}
function vars(){var d={};document.querySelectorAll('[data-composition-variables]').forEach(function(el){try{JSON.parse(el.getAttribute('data-composition-variables')).forEach(function(v){if(v&&v.id!=null&&'default' in v)d[v.id]=v.default})}catch(e){}});document.querySelectorAll('[data-variable-values]').forEach(function(el){try{var o=JSON.parse(el.getAttribute('data-variable-values'));for(var k in o)d[k]=o[k]}catch(e){}});var o=own(parent.HF_VARS)||{};for(var k in o)if(o[k]!==''&&o[k]!=null)d[k]=o[k];return d}
window.__hyperframes={getVariables:vars};
window.__hfApply=function(){var tx=own(parent.HF_TEXTS)||{};for(var i in tx){if(tx[i]==null)continue;document.querySelectorAll('[data-hft="'+i+'"]').forEach(function(el){el.textContent=tx[i]})}
var v=vars(),r=document.querySelector('[data-composition-id]')||document.documentElement;for(var k in v){if(typeof v[k]==='string'||typeof v[k]==='number'){r.style.setProperty('--'+k,v[k]);r.style.setProperty('--'+k.replace(/[A-Z]/g,function(c){return '-'+c.toLowerCase()}),v[k])}}};

    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Avatar Group Hover - Demo</title>
    <script src="../_lib/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: #f7f7f8;
        font-family: Inter, system-ui, sans-serif;
      }
      .demo-frame {
        display: grid;
        place-items: center;
        min-width: 760px;
        min-height: 480px;
        padding: 56px;
        /* ponytail: scale-only fix — GSAP animates the spans inside, not this wrapper */
        transform: scale(3.5);
      }
      .hf-transition-avatar-group-hover {
        display: inline-flex;
        align-items: center;
        padding-left: 18px;
        font-family: Inter, system-ui, sans-serif;
      }
      .hf-transition-avatar-group-hover span {
        display: grid;
        place-items: center;
        width: 54px;
        height: 54px;
        margin-left: -18px;
        border: 3px solid #fff;
        border-radius: 999px;
        background: linear-gradient(135deg, #111827, #0ea5e9);
        color: #fff;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.01em;
        box-shadow: 0 12px 30px rgba(24, 24, 27, 0.18);
        transform: translateY(var(--hf-avatar-y, 0px));
      }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="avatar-group-hover-demo" data-start="0" data-width="1920" data-height="1080" data-duration="5">
      <div class="demo-frame">
        <div class="hf-transition-avatar-group-hover" data-composition-variables="[
    { &quot;id&quot;: &quot;size&quot;, &quot;type&quot;: &quot;enum&quot;, &quot;role&quot;: &quot;style&quot;, &quot;label&quot;: &quot;Size&quot;, &quot;description&quot;: &quot;Avatar diameter, with the initials scaling alongside it.&quot;, &quot;default&quot;: &quot;standard&quot;, &quot;options&quot;: [{ &quot;value&quot;: &quot;small&quot;, &quot;label&quot;: &quot;Small&quot; }, { &quot;value&quot;: &quot;standard&quot;, &quot;label&quot;: &quot;Standard&quot; }, { &quot;value&quot;: &quot;large&quot;, &quot;label&quot;: &quot;Large&quot; }] },
    { &quot;id&quot;: &quot;overlap&quot;, &quot;type&quot;: &quot;enum&quot;, &quot;role&quot;: &quot;style&quot;, &quot;label&quot;: &quot;Overlap&quot;, &quot;description&quot;: &quot;How far each avatar tucks under the one before it, as a share of its own diameter.&quot;, &quot;default&quot;: &quot;standard&quot;, &quot;options&quot;: [{ &quot;value&quot;: &quot;tight&quot;, &quot;label&quot;: &quot;Tight&quot; }, { &quot;value&quot;: &quot;standard&quot;, &quot;label&quot;: &quot;Standard&quot; }, { &quot;value&quot;: &quot;loose&quot;, &quot;label&quot;: &quot;Loose&quot; }] },
    { &quot;id&quot;: &quot;accent&quot;, &quot;type&quot;: &quot;enum&quot;, &quot;role&quot;: &quot;style&quot;, &quot;label&quot;: &quot;Accent&quot;, &quot;description&quot;: &quot;Colour the avatar gradient resolves into.&quot;, &quot;default&quot;: &quot;blue&quot;, &quot;options&quot;: [{ &quot;value&quot;: &quot;blue&quot;, &quot;label&quot;: &quot;Blue&quot; }, { &quot;value&quot;: &quot;violet&quot;, &quot;label&quot;: &quot;Violet&quot; }, { &quot;value&quot;: &quot;green&quot;, &quot;label&quot;: &quot;Green&quot; }] }
  ]">
          <span>A</span><span>B</span><span>C</span><span>D</span>
        </div>
      </div>
      <script>window.__hfApply&&window.__hfApply()</script><script>
        (function () {
          "use strict";

          var vars =
            window.__hyperframes && window.__hyperframes.getVariables
              ? window.__hyperframes.getVariables()
              : {};

          // Unrecognised overrides return to their declared defaults.
          var sizes = { small: 42, standard: 54, large: 70 };
          var fonts = { small: "0.8em", standard: "1em", large: "1.3em" };
          // Overlap is a share of the diameter, so the two knobs stay independent.
          var overlaps = { tight: 0.5, standard: 1 / 3, loose: 0.12 };
          var accents = { blue: "#0ea5e9", violet: "#a78bfa", green: "#34d399" };

          function pick(table, value, fallback) {
            return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
          }

          var sizeName = pick(sizes, vars.size, "standard");
          var overlapName = pick(overlaps, vars.overlap, "standard");
          var accent = accents[pick(accents, vars.accent, "blue")];
          var diameter = sizes[sizeName];
          var overlap = Math.round(diameter * overlaps[overlapName]);

          var roots = document.querySelectorAll(".hf-transition-avatar-group-hover");
          for (var i = 0; i < roots.length; i += 1) {
            var style = roots[i].style;
            style.setProperty("--hf-avatar-size", diameter + "px");
            style.setProperty("--hf-avatar-font", fonts[sizeName]);
            style.setProperty("--hf-avatar-overlap", overlap + "px");
            style.setProperty("--hf-avatar-accent", accent);
          }
        })();
      </script>
      <script>
        const tl = gsap.timeline({ paused: true });
        const startTime = 0.5;
        tl.to(
          ".hf-transition-avatar-group-hover span",
          {
            "--hf-avatar-y": "-18px",
            duration: 0.28,
            stagger: { each: 0.035, from: "center" },
            ease: "back.out(1.8)",
          },
          startTime,
        );
        tl.to(
          ".hf-transition-avatar-group-hover span",
          {
            "--hf-avatar-y": "0px",
            duration: 0.42,
            stagger: { each: 0.035, from: "center" },
            ease: "bounce.out",
          },
          startTime + 0.36,
        );
        tl.set({}, {}, 5);
        window.__timelines = window.__timelines || {};
        window.__timelines["avatar-group-hover-demo"] = tl;
      </script>
    </div>
    <style>
      .hf-transition-avatar-group-hover {
        display: inline-flex;
        align-items: center;
        padding-left: var(--hf-avatar-overlap, 18px);
        font-family: Inter, system-ui, sans-serif;
      }
      .hf-transition-avatar-group-hover span {
        display: grid;
        place-items: center;
        width: var(--hf-avatar-size, 54px);
        height: var(--hf-avatar-size, 54px);
        margin-left: calc(-1 * var(--hf-avatar-overlap, 18px));
        border: 3px solid #fff;
        border-radius: 999px;
        background: linear-gradient(135deg, #111827, var(--hf-avatar-accent, #0ea5e9));
        color: #fff;
        font-size: var(--hf-avatar-font, 1em);
        font-weight: 900;
        box-shadow: 0 12px 30px rgba(24, 24, 27, 0.18);
        transform: translateY(var(--hf-avatar-y, 0px));
      }
    </style>
  

</body></html>
