          // Local-frame nose angle of the arrowhead (tip minus the shape's centroid).
          var NOSE_DEG = -106;
          var H_STEP = 1 / 120;
          function wrap(deg) {
            return ((((deg + 180) % 360) + 360) % 360) - 180;
          }

          function render(t) {
            var p = positionAt(t);
            var before = positionAt(Math.max(0, t - H_STEP));
            var after = positionAt(Math.min(duration, t + H_STEP));
            var vx = (after.x - before.x) / (2 * H_STEP);
            var vy = (after.y - before.y) / (2 * H_STEP);
            var speed = Math.hypot(vx, vy) / unit;
            var travelDeg = (Math.atan2(vy, vx) * 180) / Math.PI;
            var steer = smooth((speed - 150) / 950);
            var rotation = steer * wrap(travelDeg - NOSE_DEG);
            var depth = depthAt(t);
            var exiting = t > T_EXIT;
            var perFrame = speed / 60;
            var smearUnits =
              blurAmount * Math.min(exiting ? 36 : 12, (exiting ? 0.28 : 0.16) * perFrame);
            var lift = Math.max(0, depth - 0.9);

            cursor.style.transform = "translate(" + p.x.toFixed(2) + "px," + p.y.toFixed(2) + "px)";
            svg.style.filter =
              "drop-shadow(0 " +
              (3 + 22 * lift).toFixed(1) +
              "px " +
              (4 + 26 * lift).toFixed(1) +
              "px rgba(0,0,0," +
              (0.34 - 0.12 * Math.min(1, lift)).toFixed(3) +
              "))";
            spin.setAttribute(
              "transform",
              "rotate(" +
                rotation.toFixed(2) +
                ") scale(" +
                (depth * PX_PER_SVG_UNIT).toFixed(4) +
                ")",
            );
            // The blur's x axis is turned onto the travel direction, then the shape turned back.
            var local = wrap(travelDeg - rotation);
            heading.setAttribute("transform", "rotate(" + local.toFixed(2) + ")");
            unheading.setAttribute("transform", "rotate(" + (-local).toFixed(2) + ")");
            smear.setAttribute("stdDeviation", smearUnits.toFixed(3) + " 0");
            cursor.style.opacity = t >= duration ? "0" : "1";
          }

          cursor.setAttribute("data-tone", tone);
          shape.setAttribute("transform", "scale(1.09 1)");

          var clock = { t: 0 };
          var tl = gsap.timeline({ paused: true });
          tl.to(
            clock,
            {
              t: duration,
              duration: duration,
              ease: "none",
              onUpdate: function () {
                render(clock.t);
              },
            },
            0,
          );
          render(0);
          tl.seek(0);
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = tl;
        })();
      </script>
    </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // First click (0.7s): the resolution thumb slides onto 4K.
      tl.to("#res-thumb", { x: 144, duration: 0.34, ease: "power3.out" }, 0.78);
      tl.to("#res-1080", { color: "#6b6f85", duration: 0.2 }, 0.78);
      tl.to("#res-4k", { color: "#111320", duration: 0.2 }, 0.78);

      // Second click (1.7s): the button presses, relabels and fills over 1s.
      tl.to("#export", { scale: 0.96, duration: 0.08, ease: "power2.in" }, 1.7);
      tl.to("#export", { scale: 1, duration: 0.22, ease: "power2.out" }, 1.78);
      tl.to("#export-idle", { opacity: 0, y: -14, duration: 0.2, ease: "power2.in" }, 1.78);
      tl.fromTo(
        "#export-busy",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.26, ease: "power3.out" },
        1.86,
      );
      tl.to("#progress", { scaleX: 1, duration: 1.0, ease: "none" }, 1.8);

      // Done (2.8s): the fill clears and a check swaps in with "Exported".
      tl.to("#export-busy", { opacity: 0, y: -14, duration: 0.12, ease: "power2.in" }, 2.8);
      tl.to("#progress", { opacity: 0, duration: 0.2, ease: "power2.out" }, 2.8);
      tl.fromTo(
        "#export-check",
        { opacity: 0, scale: 0.3, filter: "blur(3px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "power3.out" },
        2.88,
      );
      tl.fromTo(
        "#export-done",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.26, ease: "power3.out" },
        2.88,
      );

      window.__timelines["dart-cursor-demo"] = tl;
    </script>
