<!doctype html>
<html lang="en"><head><style>[data-hf-demo]{visibility:hidden!important}[data-hf-anc]{background:transparent!important;box-shadow:none!important;border-color:transparent!important}</style><script>(function(){
function own(o){try{return (parent!==window&&o&&o[window.name])||null}catch(e){return null}}
function vars(){var d={};document.querySelectorAll('[data-composition-variables]').forEach(function(el){try{JSON.parse(el.getAttribute('data-composition-variables')).forEach(function(v){if(v&&v.id!=null&&'default' in v)d[v.id]=v.default})}catch(e){}});document.querySelectorAll('[data-variable-values]').forEach(function(el){try{var o=JSON.parse(el.getAttribute('data-variable-values'));for(var k in o)d[k]=o[k]}catch(e){}});var o=own(parent.HF_VARS)||{};for(var k in o)if(o[k]!==''&&o[k]!=null)d[k]=o[k];return d}
window.__hyperframes={getVariables:vars};
window.__hfApply=function(){var tx=own(parent.HF_TEXTS)||{};for(var i in tx){if(tx[i]==null)continue;document.querySelectorAll('[data-hft="'+i+'"]').forEach(function(el){el.textContent=tx[i]})}
var v=vars(),r=document.querySelector('[data-composition-id]')||document.documentElement;for(var k in v){if(typeof v[k]==='string'||typeof v[k]==='number'){r.style.setProperty('--'+k,v[k]);r.style.setProperty('--'+k.replace(/[A-Z]/g,function(c){return '-'+c.toLowerCase()}),v[k])}}};
})();</script>
    <meta charset="UTF-8">
    <script src="../_lib/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      body {
        width: 1920px;
        height: 1080px;
        font-family: "Montserrat", sans-serif;
      }

      #root .lt {
        position: absolute;
        left: 120px;
        bottom: 120px;
      }
      #root .lt-pill {
        display: flex;
        align-items: center;
        gap: 22px;
        background: #ffffff;
        border-radius: 999px;
        padding: 20px 40px 20px 26px;
        box-shadow: 0 16px 46px rgba(15, 17, 21, 0.2);
        transform-origin: 0% 100%;
        will-change: transform;
      }
      #root .lt-dot {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #ff5a36;
        flex-shrink: 0;
      }
      #root .lt-text {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      #root .lt-name {
        font-size: 46px;
        font-weight: 700;
        color: #0f1115;
        line-height: 1.04;
        letter-spacing: -0.015em;
        white-space: nowrap;
      }
      #root .lt-role {
        font-size: 25px;
        font-weight: 400;
        color: #5a6170;
        line-height: 1.2;
        letter-spacing: 0.01em;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="lt-soft-pill" data-width="1920" data-height="1080" data-start="0" data-duration="4.8">
      <div id="lt-clip" class="clip" data-start="0" data-duration="4.8" data-track-index="0">
        <div id="lt" class="lt">
          <div id="lt-pill" class="lt-pill">
            <div id="lt-dot" class="lt-dot"></div>
            <div class="lt-text">
              <div id="lt-name" class="lt-name" data-hft="0">Dr. Maya Chen</div>
              <div id="lt-role" class="lt-role" data-hft="1">Host · Neuroscientist</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>window.__hfApply&&window.__hfApply()</script><script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var wrap = document.getElementById("lt");
      var pill = document.getElementById("lt-pill");
      var dot = document.getElementById("lt-dot");
      var nameEl = document.getElementById("lt-name");
      var role = document.getElementById("lt-role");

      // Pill scales up from the lower-left anchor, dot pulses in, text settles.
      gsap.set(pill, { scale: 0.88, y: 18, opacity: 0 });
      gsap.set(dot, { scale: 0 });
      gsap.set([nameEl, role], { opacity: 0, x: -10 });

      tl.to(pill, { scale: 1, y: 0, opacity: 1, duration: 0.55, ease: "back.out(1.7)" }, 0.1);
      tl.to(dot, { scale: 1, duration: 0.4, ease: "back.out(3)" }, 0.4);
      tl.to(nameEl, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.42);
      tl.to(role, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.5);

      // Exit: settle down + hard kill.
      tl.to(pill, { scale: 0.94, y: 14, opacity: 0, duration: 0.35, ease: "power2.in" }, 4.3);
      tl.set(wrap, { visibility: "hidden" }, 4.75);

      window.__timelines["lt-soft-pill"] = tl;
    </script>
  

</body></html>
