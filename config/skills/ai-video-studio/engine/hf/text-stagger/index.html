<html lang="en"><head><style>[data-hf-demo]{visibility:hidden!important}[data-hf-anc]{background:transparent!important;box-shadow:none!important;border-color:transparent!important}</style><script>(function(){
function own(o){try{return (parent!==window&&o&&o[window.name])||null}catch(e){return null}}
function vars(){var d={};document.querySelectorAll('[data-composition-variables]').forEach(function(el){try{JSON.parse(el.getAttribute('data-composition-variables')).forEach(function(v){if(v&&v.id!=null&&'default' in v)d[v.id]=v.default})}catch(e){}});document.querySelectorAll('[data-variable-values]').forEach(function(el){try{var o=JSON.parse(el.getAttribute('data-variable-values'));for(var k in o)d[k]=o[k]}catch(e){}});var o=own(parent.HF_VARS)||{};for(var k in o)if(o[k]!==''&&o[k]!=null)d[k]=o[k];return d}
window.__hyperframes={getVariables:vars};
window.__hfApply=function(){var tx=own(parent.HF_TEXTS)||{};for(var i in tx){if(tx[i]==null)continue;document.querySelectorAll('[data-hft="'+i+'"]').forEach(function(el){el.textContent=tx[i]})}
var v=vars(),r=document.querySelector('[data-composition-id]')||document.documentElement;for(var k in v){if(typeof v[k]==='string'||typeof v[k]==='number'){r.style.setProperty('--'+k,v[k]);r.style.setProperty('--'+k.replace(/[A-Z]/g,function(c){return '-'+c.toLowerCase()}),v[k])}}};
})();</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Text Stagger - Demo</title>
    <script src="../_lib/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: #fafafa;
        font-family: Inter, system-ui, sans-serif;
      }
      .demo-frame {
        display: grid;
        place-items: center;
        gap: 28px;
        /* Scale the non-GSAP wrapper while keeping the full phrase inside the frame. */
        transform: scale(1.9);
        transform-origin: center center;
      }
      .demo-label {
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #737379;
      }
      .hf-transition-text-stagger {
        display: flex;
        flex-wrap: wrap;
        gap: 0.24em;
        color: #18181b;
        font:
          900 74px/0.95 Inter,
          system-ui,
          sans-serif;
        letter-spacing: -0.045em;
      }
      .hf-transition-text-stagger span {
        display: inline-block;
        background: linear-gradient(90deg, #18181b, #18181b, #71717a, #18181b);
        background-size: 240% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        will-change: transform, opacity, filter, background-position;
      }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="text-stagger-demo" data-start="0" data-width="1920" data-height="1080" data-duration="5">
      <div class="demo-frame">
        <div class="demo-label" data-hft="0">text-stagger</div>
        <div class="hf-transition-text-stagger" data-composition-variables="[
    {&quot;id&quot;: &quot;text&quot;, &quot;type&quot;: &quot;string&quot;, &quot;role&quot;: &quot;content&quot;, &quot;label&quot;: &quot;Text&quot;, &quot;description&quot;: &quot;Headline copy. Every whitespace-separated word becomes one staggered span.&quot;, &quot;default&quot;: &quot;Build motion systems fast&quot;},
    {&quot;id&quot;: &quot;size&quot;, &quot;type&quot;: &quot;number&quot;, &quot;role&quot;: &quot;layout&quot;, &quot;label&quot;: &quot;Size&quot;, &quot;description&quot;: &quot;Type size of every word in pixels, clamped to 24-160. Line height stays proportional.&quot;, &quot;default&quot;: 74, &quot;min&quot;: 24, &quot;max&quot;: 160, &quot;step&quot;: 1, &quot;unit&quot;: &quot;px&quot;},
    {&quot;id&quot;: &quot;tone&quot;, &quot;type&quot;: &quot;enum&quot;, &quot;role&quot;: &quot;style&quot;, &quot;label&quot;: &quot;Tone&quot;, &quot;description&quot;: &quot;Base word colour: ink for light frames, paper for dark ones.&quot;, &quot;default&quot;: &quot;ink&quot;, &quot;options&quot;: [{&quot;value&quot;: &quot;ink&quot;, &quot;label&quot;: &quot;Ink&quot;}, {&quot;value&quot;: &quot;paper&quot;, &quot;label&quot;: &quot;Paper&quot;}]},
    {&quot;id&quot;: &quot;accent&quot;, &quot;type&quot;: &quot;enum&quot;, &quot;role&quot;: &quot;style&quot;, &quot;label&quot;: &quot;Accent&quot;, &quot;description&quot;: &quot;Colour of the shimmer the second timeline step sweeps across the words.&quot;, &quot;default&quot;: &quot;blue&quot;, &quot;options&quot;: [{&quot;value&quot;: &quot;blue&quot;, &quot;label&quot;: &quot;Blue&quot;}, {&quot;value&quot;: &quot;green&quot;, &quot;label&quot;: &quot;Green&quot;}, {&quot;value&quot;: &quot;violet&quot;, &quot;label&quot;: &quot;Violet&quot;}]}
  ]">
          <span data-hft="1">Build</span>
          <span data-hft="2">motion</span>
          <span data-hft="3">systems</span>
          <span data-hft="4">fast</span>
        </div>
      </div>
      <script>window.__hfApply&&window.__hfApply()</script><script>
        (function () {
          "use strict";

          var vars =
            window.__hyperframes && window.__hyperframes.getVariables
              ? window.__hyperframes.getVariables()
              : {};

          // Unrecognised overrides return to their declared defaults.
          var DEFAULT_TEXT = "Build motion systems fast";
          var tones = { ink: "#111827", paper: "#f8fafc" };
          var accents = { blue: "#38bdf8", green: "#34d399", violet: "#a78bfa" };

          function pick(table, value, fallback) {
            return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
          }

          var words = String(vars.text == null ? DEFAULT_TEXT : vars.text)
            .split(/\s+/)
            .filter(function (word) {
              return word.length > 0;
            });
          if (words.length === 0) words = DEFAULT_TEXT.split(" ");

          // Number(null) is 0, so null has to miss the numeric branch and clamp back
          // to the declared default instead of snapping to the minimum.
          var size = typeof vars.size === "number" ? vars.size : parseFloat(vars.size);
          if (!isFinite(size)) size = 74;
          size = Math.min(160, Math.max(24, size));

          var tone = tones[pick(tones, vars.tone, "ink")];
          var accent = accents[pick(accents, vars.accent, "blue")];

          var roots = document.querySelectorAll(".hf-transition-text-stagger");
          for (var i = 0; i < roots.length; i += 1) {
            var root = roots[i];
            root.style.setProperty("--hf-stagger-size", size + "px");
            root.style.setProperty("--hf-stagger-ink", tone);
            root.style.setProperty("--hf-stagger-accent", accent);
            // Rebuilt without whitespace between the spans: whitespace-only text
            // between flex items is not rendered, so this matches the markup above.
            root.textContent = "";
            for (var w = 0; w < words.length; w += 1) {
              var span = document.createElement("span");
              span.textContent = words[w];
              root.appendChild(span);
            }
          }
        })();
      </script>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(
          ".hf-transition-text-stagger span",
          { opacity: 0, y: 48, filter: "blur(14px)" },
          {
            opacity: 1,
            y: 0,
            filter: "blur(0px)",
            duration: 0.54,
            stagger: 0.09,
            ease: "power3.out",
          },
          0.35,
        );
        tl.to(
          ".hf-transition-text-stagger span",
          { backgroundPosition: "100% 0%", duration: 0.72, stagger: 0.04, ease: "power2.inOut" },
          1.05,
        );
        tl.set({}, {}, 5);
        window.__timelines = window.__timelines || {};
        window.__timelines["text-stagger-demo"] = tl;
      </script>
    </div>
