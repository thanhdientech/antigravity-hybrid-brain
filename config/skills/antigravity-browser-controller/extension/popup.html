<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Antigravity Controller</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 10px;
      background: #0284c7;
      color: white;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .status-card {
      background: #1e293b;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #334155;
    }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }
    .dot.connected {
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }
    .dot.disconnected {
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
    }
    .info-label {
      color: #94a3b8;
      font-size: 12px;
      margin-top: 6px;
    }
    .info-val {
      color: #cbd5e1;
      font-family: monospace;
      font-size: 12px;
    }
    .btn {
      width: 100%;
      background: #0284c7;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #0369a1;
    }
    .log-box {
      background: #020617;
      border-radius: 6px;
      padding: 8px;
      font-family: monospace;
      font-size: 11px;
      color: #a5f3fc;
      max-height: 110px;
      overflow-y: auto;
      border: 1px solid #1e293b;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">⚡ Antigravity Browser</div>
    <span class="badge">V1.0</span>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span>Trạng thái:</span>
      <span id="status-text">
        <span class="dot disconnected" id="status-dot"></span>
        <strong id="status-label">Đang kết nối...</strong>
      </span>
    </div>
    <div class="info-label" style="margin-top: 8px;">Định Danh Profile Này:</div>
    <div style="display: flex; gap: 6px; margin-top: 4px;">
      <input type="text" id="profile-input" CONFIG_REQUIRED="Ví dụ: 67, suno, fb..." style="flex: 1; background: #0f172a; border: 1px solid #475569; color: #38bdf8; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold;">
      <button id="save-profile-btn" style="background: #0284c7; color: white; border: none; border-radius: 4px; padding: 4px 10px; font-size: 11px; font-weight: bold; cursor: pointer;">Lưu</button>
    </div>
    <div class="info-label" style="margin-top: 8px;">Cổng Bridge Server:</div>
    <div class="info-val" id="server-url">ws://127.0.0.1:8765</div>
  </div>

  <button class="btn" id="reconnect-btn">🔄 Kết Nối Lại (Reconnect)</button>

  <div class="info-label" style="margin-top: 12px;">Lệnh Agent gần nhất:</div>
  <div class="log-box" id="recent-logs">
    [Hệ thống] Tiện ích sẵn sàng nhận lệnh...
  </div>

  <script src="popup.js"></script>
</body>
</html>
